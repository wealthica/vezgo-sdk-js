name: Tests and quality checks

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 18 is EOL and the build toolchain (vite 8 / vitest 4 / eslint 10)
          # requires >= 20.19. This is the toolchain's runtime only — the published
          # bundles still target node18 (see vite.config.node.mjs).
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Run build
        run: yarn build
