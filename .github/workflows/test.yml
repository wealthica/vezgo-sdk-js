name: Tests and quality checks

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 18 is EOL and the build toolchain (vite 8 / vitest 4 / eslint 10)
          # requires >= 20.19. This is the toolchain's runtime only — the published
          # bundles still target node18 (see vite.config.node.mjs).
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Run build
        run: yarn build
