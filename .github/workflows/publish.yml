name: Publish to npm

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  # npm trusted publishing (OIDC) and provenance
  id-token: write

jobs:
  publish:
    name: Publish

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Run build
        run: yarn build

      # The browser bundle inlines axios, so it must be the version the lockfile resolves
      - name: Check bundled axios version
        env:
          BUNDLE: dist/vezgo.umd.js
        run: |
          versions=$(grep -A1 -E '^"?axios@' yarn.lock | sed -n 's/^  version "\(.*\)"$/\1/p' | sort -u)
          if [ "$(echo "$versions" | wc -l)" -ne 1 ] || [ -z "$versions" ]; then
            echo "::error::Expected exactly one axios version in yarn.lock, got: $versions"
            exit 1
          fi
          if ! grep -qE "[\"'\`]${versions//./\.}[\"'\`]" "$BUNDLE"; then
            echo "::error::$BUNDLE does not inline axios $versions from yarn.lock"
            exit 1
          fi
          echo "$BUNDLE inlines axios $versions"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Only used if trusted publishing is not configured for the package
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
